services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ir_system
      POSTGRES_USER: ir_user
      POSTGRES_PASSWORD: ir_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ir_user -d ir_system"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ir_system
      DB_USER: ir_user
      DB_PASSWORD: ir_password
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
