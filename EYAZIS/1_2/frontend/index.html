<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IR System - Search</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">IR System</div>
        <div class="nav-links">
            <a href="index.html" class="nav-link active">Search</a>
            <a href="upload.html" class="nav-link">Upload</a>
            <a href="documents.html" class="nav-link">Documents</a>
            <a href="metrics.html" class="nav-link">Metrics</a>
            <a href="help.html" class="nav-link">Help</a>
        </div>
    </nav>

    <main class="container">
        <div class="search-hero">
            <h1>Information Retrieval System</h1>
            <p class="subtitle">Vector Space Model with TF-IDF and PostgreSQL pgvector</p>
        </div>

        <div class="search-box">
            <form id="searchForm">
                <div class="input-group">
                    <input type="text" id="searchInput" placeholder="Enter your search query..." autocomplete="off">
                    <button type="submit" class="btn btn-primary">Search</button>
                </div>
            </form>
        </div>

        <div id="searchResults" class="search-results hidden">
            <div class="results-header">
                <h2>Search Results</h2>
                <span id="resultCount" class="result-count"></span>
            </div>
            <div id="keywords" class="keywords"></div>
            <div id="resultsList" class="results-list"></div>
        </div>
    </main>

    <div id="helpModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Document Preview</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
