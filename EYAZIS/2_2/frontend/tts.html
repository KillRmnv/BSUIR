<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IR System - Speech</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">IR System</div>
        <div class="nav-links">
            <a href="index.html" class="nav-link">Search</a>
            <a href="upload.html" class="nav-link">Upload</a>
            <a href="documents.html" class="nav-link">Documents</a>
            <a href="metrics.html" class="nav-link">Metrics</a>
            <a href="classify.html" class="nav-link">Classification</a>
            <a href="summarize.html" class="nav-link">Summarize</a>
            <a href="translate.html" class="nav-link">Translate</a>
            <a href="tts.html" class="nav-link active">Speech</a>
            <a href="stt.html" class="nav-link">Voice</a>
            <a href="help.html" class="nav-link">Help</a>
        </div>
    </nav>

    <main class="container">
        <div class="search-hero">
            <h1>Speech Synthesis</h1>
            <p class="subtitle">Offline EN/FR text-to-speech (Piper neural + eSpeak-NG) for literary texts</p>
        </div>

        <div class="upload-section">
            <!-- Left: input -->
            <div class="upload-card">
                <h3>Input</h3>

                <div class="form-group">
                    <label for="sampleSelect">Literary sample</label>
                    <select id="sampleSelect" style="width:100%; padding:8px; border:1px solid var(--border); border-radius:var(--radius);">
                        <option value="">— Custom text —</option>
                        <option value="fr1">Baudelaire — L'Étranger (FR)</option>
                        <option value="fr2">Lamartine — Le Lac (FR)</option>
                        <option value="en1">Wilde — The Picture of Dorian Gray (EN)</option>
                        <option value="en2">Shakespeare — Sonnet 18 (EN)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="ttsText">Text <small>(type or press Ctrl+V to paste)</small></label>
                    <textarea id="ttsText" rows="10"
                        placeholder="Paste or type the text to speak (English or French)..."
                        style="width:100%; padding:8px; border:1px solid var(--border); border-radius:var(--radius); font-family:inherit; resize:vertical;"></textarea>
                </div>

                <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px;">
                    <button class="btn btn-secondary btn-small" id="pasteBtn">Paste from clipboard</button>
                    <button class="btn btn-secondary btn-small" id="detectBtn">Detect language</button>
                </div>

                <div class="form-group">
                    <label for="voiceSelect">Voice</label>
                    <select id="voiceSelect" style="width:100%; padding:8px; border:1px solid var(--border); border-radius:var(--radius);"></select>
                </div>

                <div class="form-group">
                    <label for="rateRange">Tempo: <strong id="rateVal">1.0×</strong></label>
                    <input type="range" id="rateRange" min="0.5" max="2" step="0.1" value="1" style="width:100%;">
                </div>

                <div class="form-group">
                    <label for="volumeRange">Volume: <strong id="volumeVal">100%</strong></label>
                    <input type="range" id="volumeRange" min="0" max="100" step="1" value="100" style="width:100%;">
                </div>

                <div class="form-group">
                    <label for="pitchRange">Pitch <small>(eSpeak only)</small>: <strong id="pitchVal">50</strong></label>
                    <input type="range" id="pitchRange" min="0" max="99" step="1" value="50" style="width:100%;">
                </div>

                <button id="synthBtn" class="btn btn-primary" style="width:100%; margin-top:8px;">
                    Synthesize &amp; Play
                </button>
                <div id="ttsStatus" class="upload-status" style="margin-top:8px;"></div>
            </div>

            <!-- Right: playback -->
            <div class="upload-card">
                <h3>Playback</h3>

                <div id="engineChips" style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; font-size:0.85rem;"></div>

                <audio id="player" controls style="width:100%; margin-bottom:12px;"></audio>

                <div id="ttsStats" class="summary-stats" style="display:none; flex-wrap:wrap;">
                    <div class="stat-item"><span class="stat-value" id="stVoice">—</span><span class="stat-label">Voice</span></div>
                    <div class="stat-item"><span class="stat-value" id="stEngine">—</span><span class="stat-label">Engine</span></div>
                    <div class="stat-item"><span class="stat-value" id="stElapsed">—</span><span class="stat-label">Synthesis, ms</span></div>
                    <div class="stat-item"><span class="stat-value" id="stDuration">—</span><span class="stat-label">Audio, s</span></div>
                    <div class="stat-item"><span class="stat-value" id="stChars">—</span><span class="stat-label">Chars</span></div>
                </div>

                <div id="ttsVoiceInfo" style="margin-top:16px; font-size:0.9rem; color:var(--text-light);"></div>

                <h3 style="margin-top:1.5rem;">Normalized text</h3>
                <div id="ttsNormalized" style="font-size:0.9rem; line-height:1.5; color:var(--text); border-top:1px solid var(--border); padding-top:8px; max-height:240px; overflow-y:auto;">
                    —
                </div>
            </div>
        </div>
    </main>
    <script src="js/voice-core.js"></script>
    <script src="js/voice-fab.js"></script>

    <script src="js/tts.js"></script>
</body>
</html>
